<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#e8e8ed">
  <title>iPod Music</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- iPod 机身 -->
    <div class="ipod">
      <div class="ipod-bezel">
        <div class="screen">
          <div class="screen-header">
            <span class="brand">iPod</span>
            <span class="status-right">
              <span id="shuffleIcon" class="mode-icon" title="随机">🔀</span>
              <span id="repeatIcon" class="mode-icon" title="循环">🔁</span>
              <span class="music-status" id="centerStatus">
                <span class="music-dot" id="musicDot"></span>
                <span class="center-label" id="centerLabel">MUSIC</span>
              </span>
            </span>
          </div>

          <div class="now-playing" id="nowPlaying">
            <div class="cover-wrap">
              <div class="cover-box" id="coverBox">
                <img id="coverImg" alt="">
                <div class="cover-placeholder" id="coverPlaceholder">
                  <svg class="apple-logo" viewBox="0 0 24 24" width="40" height="40" fill="currentColor" opacity="0.28">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.22-1.98 1.08-3.13-1.05.04-2.31.7-3.06 1.58-.67.78-1.25 2.03-1.09 3.22 1.15.09 2.33-.58 3.07-1.67z"/>
                  </svg>
                </div>
              </div>
            </div>
            <div class="meta">
              <div class="now-label">NOW PLAYING</div>
              <div class="track-title" id="title">选择音乐</div>
              <div class="track-artist" id="artist">点击 MENU 添加</div>
              <div class="track-album" id="album"></div>
            </div>
          </div>

          <div class="progress-area">
            <div class="progress-bar" id="progressBar">
              <div class="progress" id="progress"></div>
            </div>
            <div class="time-row">
              <span id="currentTime">0:00</span>
              <span class="playback-spacer"></span>
              <span id="duration">0:00</span>
            </div>
          </div>

          <div class="screen-footer">
            <button class="status-hint" id="statusHintBtn">ADD A MUSIC FILE</button>
            <div class="footer-right">
              <button class="scrub-switch" id="scrubToggle" title="轮盘滑动调进度" aria-pressed="true" role="switch">
                <span class="scrub-switch-track">
                  <span class="scrub-switch-knob"></span>
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="click-wheel">
        <div class="wheel-outer" id="wheelOuter">
          <!-- 圆环滑动热区：外圈可转，中心留给按钮 -->
          <div class="wheel-scrub" id="wheelScrub"></div>
          <button class="wheel-btn menu-btn" id="menuBtn">MENU</button>
          <button class="wheel-btn prev-btn" id="prevBtn" aria-label="上一曲">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="wheel-btn next-btn" id="nextBtn" aria-label="下一曲">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button class="wheel-btn play-btn" id="playBtn" aria-label="播放/暂停">
            <svg id="playIcon" viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="wheel-center"></div>
        </div>
      </div>

      <div class="ipod-footer">
        <span class="apple-mark"></span>
        <span>MUSIC CLASSIC</span>
        <span class="capacity">20 GB</span>
      </div>
    </div>

    <!-- 音乐库 -->
    <div class="library">
      <div class="library-header">
        <div>
          <div class="library-sub">YOUR MUSIC</div>
          <div class="library-title">音乐库</div>
        </div>
        <button class="add-btn" id="libraryAddBtn">+ 添加音乐</button>
      </div>
      <div class="library-list" id="libraryList">
        <div class="empty-tip">还没有歌曲，点击右上角添加</div>
      </div>
    </div>
  </div>

  <!-- 弹层 -->
  <div class="sheet-panel" id="sheetPanel">
    <div class="sheet">
      <div class="sheet-header">
        <h3>音乐</h3>
        <div class="header-actions">
          <button class="mode-btn" id="shuffleBtn" title="随机">🔀</button>
          <button class="mode-btn" id="repeatBtn" title="循环">🔁</button>
          <button class="close-btn" id="closeSheet">完成</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="local" id="tabLocal">本地</button>
        <button class="tab" data-tab="online" id="tabOnline">在线搜索</button>
        <button class="source-check-btn" id="sourceCheckBtn" title="检测音源可用性">检测</button>
      </div>
      <div class="anim-row">
        <span class="anim-label">封面动画</span>
        <select id="coverAnimSelect" class="anim-select">
          <option value="flip">翻页</option>
          <option value="fade">淡入淡出</option>
          <option value="zoom">缩放</option>
          <option value="slide">滑动</option>
          <option value="none">无动画</option>
        </select>
      </div>

      <div class="tab-panel active" id="panelLocal">
        <div class="list" id="playlist"></div>
        <div class="upload-area">
          <label class="upload-btn" for="fileInput">从手机选择音乐</label>
          <input type="file" id="fileInput" accept="audio/*" multiple>
        </div>
      </div>

      <div class="tab-panel" id="panelOnline">
        <div class="search-box">
          <select id="sourceSelect" class="source-select">
            <option value="netease">网易云</option>
            <option value="tencent">QQ音乐</option>
            <option value="kuwo">酷我</option>
            <option value="joox">JOOX</option>
            <option value="tidal">Tidal</option>
            <option value="ytmusic">YouTube Music</option>
          </select>
          <input type="search" id="searchInput" placeholder="搜索歌曲 / 歌手" enterkeyhint="search">
          <button id="searchBtn" class="search-btn">搜索</button>
        </div>
        <div class="search-status" id="searchStatus"></div>
        <div class="list" id="searchResults">
          <div class="empty-tip">输入关键词搜索在线音乐</div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>
  <script src="script.js"></script>
</body>
</html>
